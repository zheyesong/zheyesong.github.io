<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
  <title id="title">Light theme particle gold palette preview</title>
  <desc id="desc">Four static palette previews for a light background particle effect: Honey Gold, Champagne Gold, Antique Gold, and Solar Gold.</desc>
  <defs>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="wideGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="clipA"><rect x="50" y="80" width="535" height="330" rx="8"/></clipPath>
    <clipPath id="clipB"><rect x="615" y="80" width="535" height="330" rx="8"/></clipPath>
    <clipPath id="clipC"><rect x="50" y="455" width="535" height="330" rx="8"/></clipPath>
    <clipPath id="clipD"><rect x="615" y="455" width="535" height="330" rx="8"/></clipPath>
    <radialGradient id="panelSheenA" cx="48%" cy="45%" r="70%">
      <stop offset="0" stop-color="#FFE6A6" stop-opacity=".32"/>
      <stop offset=".55" stop-color="#FFD166" stop-opacity=".14"/>
      <stop offset="1" stop-color="#F7F3E8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="panelSheenB" cx="48%" cy="45%" r="70%">
      <stop offset="0" stop-color="#FFF1C6" stop-opacity=".34"/>
      <stop offset=".56" stop-color="#E9C45C" stop-opacity=".13"/>
      <stop offset="1" stop-color="#F7F3E8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="panelSheenC" cx="48%" cy="45%" r="70%">
      <stop offset="0" stop-color="#FFD984" stop-opacity=".35"/>
      <stop offset=".55" stop-color="#B87A16" stop-opacity=".16"/>
      <stop offset="1" stop-color="#F7F3E8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="panelSheenD" cx="48%" cy="45%" r="70%">
      <stop offset="0" stop-color="#FFE96F" stop-opacity=".42"/>
      <stop offset=".55" stop-color="#FFB000" stop-opacity=".18"/>
      <stop offset="1" stop-color="#F7F3E8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trailA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF7D1"/>
      <stop offset=".42" stop-color="#FFD166"/>
      <stop offset="1" stop-color="#C98508"/>
    </linearGradient>
    <linearGradient id="trailB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF9DD"/>
      <stop offset=".46" stop-color="#F4D36D"/>
      <stop offset="1" stop-color="#A87914"/>
    </linearGradient>
    <linearGradient id="trailC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE7A8"/>
      <stop offset=".43" stop-color="#D79A20"/>
      <stop offset="1" stop-color="#80500F"/>
    </linearGradient>
    <linearGradient id="trailD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF2A8"/>
      <stop offset=".40" stop-color="#FFC338"/>
      <stop offset="1" stop-color="#E98200"/>
    </linearGradient>
    <style>
      .page-bg{fill:#f7f3e8}
      .panel{fill:#f7f3e8;stroke:rgba(0,0,0,.08);stroke-width:1}
      .glass{fill:rgba(255,255,255,.32);stroke:rgba(0,0,0,.07);stroke-width:1}
      .label{font:700 20px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17120a}
      .sub{font:500 13px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#5c5547}
      .chipText{font:600 11px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#221a0c}
      .mockTitle{font:700 18px Georgia,"Times New Roman",serif;fill:#111}
      .mockText{font:500 11px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#5b554a}
      .fine{font:600 10px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#6a604f}
      .trail{fill:none;stroke-linecap:round;filter:url(#softGlow)}
      .veil{opacity:.75}
      .center{filter:url(#softGlow)}
      .bloom{filter:url(#wideGlow)}
    </style>
  </defs>

