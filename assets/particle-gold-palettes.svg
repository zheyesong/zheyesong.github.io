    <circle cx="318" cy="620" r="6" fill="#D79A20" opacity=".82" class="center"/>
    <rect x="98" y="503" width="178" height="92" rx="8" class="glass"/>
    <text x="116" y="538" class="mockTitle">Zheye Song</text>
