  <text x="72" y="130" class="sub">Balanced, warmer than current, still soft.</text>
  <rect x="72" y="365" width="74" height="22" rx="8" fill="#FFF7D1" stroke="rgba(0,0,0,.08)"/><text x="82" y="380" class="chipText">FFF7D1</text>
  <rect x="152" y="365" width="74" height="22" rx="8" fill="#FFD166" stroke="rgba(0,0,0,.08)"/><text x="162" y="380" class="chipText">FFD166</text>
