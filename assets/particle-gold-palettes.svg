  <text x="637" y="130" class="sub">Lightest and most polished, less orange.</text>
  <rect x="637" y="365" width="74" height="22" rx="8" fill="#FFF9DD" stroke="rgba(0,0,0,.08)"/><text x="647" y="380" class="chipText">FFF9DD</text>
