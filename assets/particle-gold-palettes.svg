  <text x="72" y="505" class="sub">Most contrast; a deeper bronze-gold signal.</text>
  <rect x="72" y="740" width="74" height="22" rx="8" fill="#FFE7A8" stroke="rgba(0,0,0,.08)"/><text x="82" y="755" class="chipText">FFE7A8</text>
