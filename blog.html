<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog — Zheye Song</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;500&family=Libre+Baskerville:wght@400;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <script>
        try {
            document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'light');
        } catch (_) {}
    </script>
    <link rel="stylesheet" href="assets/styles.css">
    <script defer src="assets/app.js"></script>
</head>
<body class="page-detail page-blog" data-page="blog">
    <canvas id="bg" aria-hidden="true"></canvas>
    <button id="themeToggle" type="button" aria-label="Toggle dark and light theme"></button>
    <button id="pauseToggle" type="button" aria-label="Pause page animation" aria-pressed="false"></button>
    <div class="wrap">
        <div id="contentRoot"></div>
    </div>
</body>
</html>
